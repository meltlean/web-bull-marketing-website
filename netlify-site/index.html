<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/logo.png" />
    <title>Web Bull Marketing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify form detector for Web Bull Remodeling Growth Calculator -->
<form
  name="remodeling-growth-plan"
  method="POST"
  data-netlify="true"
  netlify-honeypot="bot-field"
  hidden
>
  <input type="hidden" name="form-name" value="remodeling-growth-plan" />
  <input name="bot-field" />

  <!-- Lead Information -->
  <input name="name" />
  <input name="company" />
  <input name="email" />
  <input name="phone" />
  <input name="website" />

  <!-- Attribution -->
  <input name="landing_page" />
  <input name="referrer" />
  <input name="utm_source" />
  <input name="utm_medium" />
  <input name="utm_campaign" />
  <input name="utm_content" />
  <input name="utm_term" />

  <!-- Calculator Inputs -->
  <input name="current_revenue" />
  <input name="target_revenue" />
  <input name="expected_revenue_without_new_acquisition" />
  <input name="average_project_value" />
  <input name="gross_margin" />
  <input name="qualified_lead_close_rate" />
  <input name="qualification_rate" />
  <input name="acquisition_allowance" />

  <!-- Current Performance -->
  <input name="current_acquisition_spend" />
  <input name="current_customers_acquired" />
  <input name="capacity" />

  <!-- Calculated Growth Results -->
  <input name="revenue_gap" />
  <input name="customers_needed" />
  <input name="qualified_leads_needed" />
  <input name="total_inquiries_needed" />

  <!-- Acquisition Economics -->
  <input name="allowable_cac" />
  <input name="target_cpql" />
  <input name="target_cpi" />

  <!-- Financial Results -->
  <input name="annual_growth_budget" />
  <input name="monthly_growth_budget" />
  <input name="projected_gross_profit" />
  <input name="gross_profit_roi_percent" />

  <!-- Diagnostic Results -->
  <input name="actual_cac" />
  <input name="diagnosis" />
</form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
